dataset:
  name: iam
  raw_path: data/raw
  processed_path: data/processed
  splits_path: data/splits
  split_ratio: [0.8, 0.1, 0.1]
  split_strategy: writer_disjoint   # no writer appears in more than one split

image:
  width: 256
  height: 64
  channels: 1                       # grayscale
  normalize: true

model:
  name: crnn
  cnn_channels: [32, 64, 128, 128, 256]
  lstm_hidden_size: 256
  lstm_layers: 2
  bidirectional: true

training:
  epochs: 30
  batch_size: 32
  learning_rate: 0.001
  optimizer: adam
  weight_decay: 0.0001
  early_stopping_patience: 5
  checkpoint_dir: models/

decoding:
  method: greedy                    # greedy | beam_search (future)

seed: 42
